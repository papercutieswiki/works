<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>lavori</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@font-face {
  font-family: "SF UI Display";
  src: url("SFUIDisplay-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  min-height: 1080px;
  background: #ffffff;
  font-family: "SF UI Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: #8c8c8c;
}
.page {
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  padding: 54px 128px 80px 44px;
  min-height: 1080px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 20px;
}
.topbar a {
  color: #8c8c8c;
  text-decoration: none;
}
.topbar a:hover {
  color: #4a4a4a;
}
.topbar span {
  color: #8c8c8c;
  user-select: none;
  pointer-events: none;
}
.genres {
  margin-top: 236px;
  list-style: none;
}
.genre-title {
  font-size: 26px;
  line-height: 1.55;
  cursor: pointer;
  display: inline-block;
  color: #8c8c8c;
}
.genre-title:hover {
  color: #4a4a4a;
}
.genre-title.active {
  color: #4a4a4a;
}
.files {
  display: none;
}
.files.open {
  display: block;
}
.files-inner {
  margin: 12px 0 28px 4px;
  padding-left: 24px;
  border-left: 1px solid #d8d8d8;
}
.file-row {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 12px 0;
}
.file-name {
  font-size: 18px;
  color: #8c8c8c;
  white-space: nowrap;
}
.file-name::before {
  content: "\2022";
  margin-right: 10px;
  color: #8c8c8c;
}
audio {
  height: 32px;
  filter: grayscale(1);
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a href="https://lucianomasala.xyz">&lt;- indietro</a>
    <span>(i miei lavori)</span>
  </div>
  <ul class="genres" id="genres"></ul>
</div>
<script>
const data = [
  {
    name: "Orchestrale - Folk",
    folder: "orchestral-folk",
    files: [
      "aviator render5 083126.mp3",
      "still Final (fixed master 26 03).mp3",
      "mimosa.flac",
      "hate v1.flac"
    ]
  },
  {
    name: "Lofi Hip-Hop",
    folder: "lofi-hip-hop",
    files: [
      "197 marie - eco stream.flac",
      "marie - Camadorea.mp3",
      "marie - grayscale Final.flac",
      "207 marie - winterberry.mp3",
      "187 marie - wandering.mp3",
      "marie - lofigirl x nativeinstruments beatbattle.mp3",
      "marie - petals on the ground.mp3",
      "marie - wooden wagon.flac",
      "sabri4.mp3"
    ]
  },
  {
    name: "Ambient",
    folder: "ambient",
    files: [
      "marie - Always There.mp3",
      "marie - One Breath Away.mp3",
      "marie - Frosted In Time.mp3",
      "marie - sorry.flac",
      "marie - phantom.flac",
      "marie - collide.flac",
      "marie - goodbye, thank you.flac",
      "hershel - despite time.mp3"
    ]
  },
  {
    name: "House",
    folder: "house",
    files: [
      "marie - Patterns (render4).mp3",
      "marie - Cerulean (render3).mp3",
      "marie - Cloverleaf (render2).mp3",
      "marie - Crystalball (render2).mp3",
      "marie - Navigator (render 4).mp3",
      "marie - Skylit (render1).mp3"
    ]
  },
  {
    name: "EDM",
    folder: "EDM",
    files: [
      "grawwww.flac",
      "2) papercuties - before.mp3",
      "4) papercuties - our songggg.mp3"
    ]
  },
  {
    name: "OST Videogiochi",
    folder: "videogames-ost",
    files: [
      "mainlobby1.mp3",
      "MainMenu1.mp3",
      "servantsquarters3.mp3",
      "ballroom3.mp3",
      "Glass Horizon render 3 ,for RoHorizons.mp3",
      "Cooling Lava render3.mp3"
    ]
  },
  {
    name: "Rock",
    folder: "rock",
    files: [
      "sabri1.mp3",
      "vocaloid test1 Redux.flac"
    ]
  }
];

const container = document.getElementById("genres");
let openFilesEl = null;
let openTitleEl = null;

document.addEventListener("play", e => {
  document.querySelectorAll("audio").forEach(a => {
    if (a !== e.target) a.pause();
  });
}, true);

data.forEach(genre => {
  const li = document.createElement("li");

  const title = document.createElement("div");
  title.className = "genre-title";
  title.textContent = genre.name;
  li.appendChild(title);

  const filesWrap = document.createElement("div");
  filesWrap.className = "files";

  const inner = document.createElement("div");
  inner.className = "files-inner";

  genre.files.forEach(fileName => {
    const src = genre.folder + "/" + encodeURIComponent(fileName);

    const row = document.createElement("div");
    row.className = "file-row";

    const nameEl = document.createElement("div");
    nameEl.className = "file-name";
    nameEl.textContent = fileName;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "none";
    audio.src = src;

    row.appendChild(nameEl);
    row.appendChild(audio);
    inner.appendChild(row);
  });

  filesWrap.appendChild(inner);
  li.appendChild(filesWrap);
  container.appendChild(li);

  title.addEventListener("click", () => {
    const isOpen = filesWrap.classList.contains("open");
    if (openFilesEl && openFilesEl !== filesWrap) {
      openFilesEl.classList.remove("open");
      if (openTitleEl) openTitleEl.classList.remove("active");
      openFilesEl.querySelectorAll("audio").forEach(a => a.pause());
    }
    if (isOpen) {
      filesWrap.classList.remove("open");
      title.classList.remove("active");
      openFilesEl = null;
      openTitleEl = null;
    } else {
      filesWrap.classList.add("open");
      title.classList.add("active");
      openFilesEl = filesWrap;
      openTitleEl = title;
    }
  });
});
</script>
</body>
</html>
